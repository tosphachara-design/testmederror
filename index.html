<!-- อัปเดตส่วน Script ในไฟล์ HTML ของคุณ -->
<script>
// *** วาง URL ที่ได้จากขั้นตอนที่ 1 ตรงนี้ ***
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzjGUHXt2NLSiL9q7u4THA9NLsNRgFoB73Nu6glaG09qUOGCyxCHT2IW3lMwNm1kZAZwg/exec';

let records = [];

// ฟังก์ชันดึงข้อมูลจาก Google Sheets
async function loadOnlineData() {
    showToast('กำลังซิงค์ข้อมูลออนไลน์...');
    try {
        const response = await fetch(SCRIPT_URL);
        records = await response.json();
        renderDashboard();
        renderTable();
        showToast('✓ ซิงค์ข้อมูลสำเร็จ');
    } catch (e) {
        showToast('❌ โหลดข้อมูลล้มเหลว (ลองเช็คการเชื่อมต่อ)');
    }
}

// ปรับปรุงระบบปีงบประมาณ (ต.ค. - ก.ย.)
function getFY(dateStr) {
    if(!dateStr) return null;
    const d = new Date(dateStr);
    const m = d.getMonth() + 1; // มกราคม = 1
    const y = d.getFullYear();
    // ถ้าเดือน >= 10 (ต.ค.) ให้นับเป็นปีงบประมาณถัดไป
    return m >= 10 ? y + 1 : y;
}

// แก้ไขฟังก์ชันบันทึกข้อมูลให้ส่งไปที่ Google Sheets
async function submitForm() {
    const data = {
        date: document.getElementById('f-date').value,
        ward: document.getElementById('f-ward').value,
        drug: document.getElementById('f-drug').value.trim(),
        type: document.getElementById('f-type').value,
        severity: document.getElementById('f-severity').value,
        hn: document.getElementById('f-hn').value.trim(),
        gender: document.getElementById('f-gender').value,
        detail: document.getElementById('f-detail').value
    };

    if(!data.date || !data.ward || !data.drug || !data.type || !data.severity) {
        showToast('⚠ กรุณากรอกข้อมูลที่จำเป็นให้ครบ');
        return;
    }

    showToast('กำลังบันทึกลง Google Drive...');
    
    try {
        await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(data)
        });
        showToast('✓ บันทึกสำเร็จ!');
        resetForm();
        loadOnlineData(); // รีโหลดข้อมูลใหม่
    } catch (e) {
        showToast('❌ บันทึกไม่สำเร็จ กรุณาลองใหม่');
    }
}

// ปรับปรุงระบบตัวเลือกปีงบประมาณใน Dashboard
function buildFYOptions() {
    const fys = [...new Set(records.map(r => getFY(r.date)).filter(Boolean))].sort((a, b) => b - a);
    const now = new Date();
    const curFY = (now.getMonth() + 1) >= 10 ? now.getFullYear() + 1 : now.getFullYear();
    if (!fys.includes(curFY)) fys.unshift(curFY);
    
    const sel = document.getElementById('df-fy');
    sel.innerHTML = fys.map(y => `<option value="${y}">ปีงบฯ ${y} (ต.ค. ${y-1} - ก.ย. ${y})</option>`).join('');
}

// สั่งให้โหลดข้อมูลทันทีเมื่อเปิดแอป
window.onload = loadOnlineData;

// เพิ่ม CSS สำหรับเคสที่รุนแรง
const style = document.createElement('style');
style.innerHTML = `
    .row-severe { background-color: #fff5f5 !important; color: #c84040; font-weight: bold; }
    .sync-btn { background: #e8f2ec; color: #1a5f3f; border: 1px solid #1a5f3f; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; margin-bottom: 10px; }
`;
document.head.appendChild(style);
</script>
